<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="noteYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="notePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="noteCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="noteGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(-16px) rotate(-3deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(8deg); }
      50% { transform: translateY(-20px) rotate(11deg); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes float4 {
      0%, 100% { transform: translateY(0px) rotate(5deg); }
      50% { transform: translateY(-18px) rotate(2deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }

    .card1 { animation: float1 7s ease-in-out infinite; transform-origin: center; }
    .card2 { animation: float2 8.5s ease-in-out infinite; transform-origin: center; }
    .card3 { animation: float3 6.5s ease-in-out infinite; transform-origin: center; }
    .card4 { animation: float4 9s ease-in-out infinite; transform-origin: center; }
    .ambient-glow { animation: pulseGlow 5s ease-in-out infinite alternate; transform-origin: center; }
    .wire-flow { stroke-dasharray: 8, 8; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="140" fill="#6366f1" filter="url(#glow)" class="ambient-glow" />
  <circle cx="1000" cy="300" r="160" fill="#06b6d4" filter="url(#glow)" class="ambient-glow" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Connecting Sync Curves (Background Layer) -->
  <path d="M 160 160 Q 350 40 600 80 T 1040 140" fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.4" class="wire-flow" />
  <path d="M 180 340 Q 420 390 650 320 T 1020 280" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="wire-flow" />

  <!-- DYNAMIC / ANIMATED STICKY NOTE WIDGETS (SIDES & BACKGROUND) -->
  
  <!-- Left Top Sticky Note (Yellow Pin) -->
  <g class="card1" filter="url(#shadow)">
    <g transform="translate(60, 60)">
      <rect width="150" height="130" rx="8" fill="url(#noteYellow)" />
      <!-- Top tape / pin header -->
      <rect x="45" y="-8" width="60" height="16" rx="4" fill="#fef9c3" opacity="0.8" />
      <circle cx="75" cy="0" r="3" fill="#ea580c" />
      <!-- Content mock -->
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#713f12">📌 SPRINT GOALS</text>
      <rect x="16" y="44" width="118" height="3" rx="1.5" fill="#ca8a04" opacity="0.7" />
      <rect x="16" y="58" width="95" height="2" rx="1" fill="#854d0e" opacity="0.6" />
      <rect x="16" y="70" width="105" height="2" rx="1" fill="#854d0e" opacity="0.6" />
      <rect x="16" y="82" width="75" height="2" rx="1" fill="#854d0e" opacity="0.6" />
      <text x="16" y="112" font-family="monospace" font-size="10" fill="#a16207">⚡ Always-on-Top</text>
    </g>
  </g>

  <!-- Left Bottom Sticky Note (Green Sync) -->
  <g class="card3" filter="url(#shadow)">
    <g transform="translate(80, 240)">
      <rect width="140" height="120" rx="8" fill="url(#noteGreen)" />
      <rect x="40" y="-6" width="60" height="14" rx="3" fill="#dcfce7" opacity="0.8" />
      <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#14532d">🔒 E2EE SYNC</text>
      <rect x="14" y="40" width="110" height="3" rx="1.5" fill="#16a34a" opacity="0.6" />
      <rect x="14" y="52" width="85" height="2" rx="1" fill="#166534" opacity="0.6" />
      <rect x="14" y="64" width="100" height="2" rx="1" fill="#166534" opacity="0.6" />
      <text x="14" y="100" font-family="monospace" font-size="10" fill="#15803d">✓ Local-First</text>
    </g>
  </g>

  <!-- Right Top Sticky Note (Pink Checklist) -->
  <g class="card2" filter="url(#shadow)">
    <g transform="translate(980, 50)">
      <rect width="155" height="135" rx="8" fill="url(#notePink)" />
      <rect x="48" y="-8" width="60" height="16" rx="4" fill="#fdf2f8" opacity="0.8" />
      <circle cx="78" cy="0" r="3" fill="#be185d" />
      <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#831843">📝 SCRATCHPAD</text>
      <rect x="16" y="44" width="122" height="3" rx="1.5" fill="#db2777" opacity="0.7" />
      <rect x="16" y="58" width="100" height="2" rx="1" fill="#9d174d" opacity="0.6" />
      <rect x="16" y="70" width="110" height="2" rx="1" fill="#9d174d" opacity="0.6" />
      <rect x="16" y="82" width="80" height="2" rx="1" fill="#9d174d" opacity="0.6" />
      <text x="16" y="115" font-family="monospace" font-size="10" fill="#be185d">⌘ Hotkey Capture</text>
    </g>
  </g>

  <!-- Right Bottom Sticky Note (Cyan Code Block) -->
  <g class="card4" filter="url(#shadow)">
    <g transform="translate(960, 235)">
      <rect width="160" height="130" rx="8" fill="url(#noteCyan)" />
      <rect x="50" y="-7" width="60" height="15" rx="3" fill="#e0f2fe" opacity="0.8" />
      <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#0c4a6e">💻 MARKDOWN</text>
      <rect x="16" y="38" width="125" height="3" rx="1.5" fill="#0284c7" opacity="0.6" />
      <rect x="16" y="50" width="105" height="2" rx="1" fill="#0369a1" opacity="0.6" />
      <rect x="16" y="62" width="90" height="2" rx="1" fill="#0369a1" opacity="0.6" />
      <rect x="16" y="74" width="115" height="2" rx="1" fill="#0369a1" opacity="0.6" />
      <text x="16" y="112" font-family="monospace" font-size="10" fill="#0284c7"># Tagging &amp; Sync</text>
    </g>
  </g>

  <!-- CENTER FOREGROUND CONTENT (Protected from all floating widgets) -->
  <g id="foreground-content">
    <!-- Center Pill Badge -->
    <g transform="translate(425, 48)">
      <rect width="350" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="1.5">ULTIMATE DESKTOP PRODUCTIVITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5">
      Desktop Sticky Notes &amp; Scratchpads
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" fill="#cbd5e1" letter-spacing="0.2">
      Curated Guide to Always-on-Top Floating Notes, Quick Capture, E2EE Sync &amp; Local Markdown Pinboards
    </text>

    <!-- Feature Feature Tag Badges in Center -->
    <g transform="translate(300, 245)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="67" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" fill="#facc15">📌 Floating Stickies</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(155, 0)">
        <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="67" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" fill="#38bdf8">⚡ Quick Scratchpad</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(310, 0)">
        <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="67" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" fill="#4ade80">🔒 E2EE &amp; Offline</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(465, 0)">
        <rect width="135" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
        <text x="67" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" fill="#f472b6">🌐 Multi-Platform</text>
      </g>
    </g>

    <!-- Bottom Metric / Status Bar -->
    <g transform="translate(370, 325)">
      <rect width="460" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="230" y="21" text-anchor="middle" font-family="monospace" font-weight="500" font-size="12" fill="#94a3b8">
        ★ Open-Source Ranked by Stars • SaaS Scaled by Market Valuation ★
      </text>
    </g>
  </g>
</svg>
